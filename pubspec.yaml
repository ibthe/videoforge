name: videoforge
description: A simple cross-platform video encoder powered by FFmpeg.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffmpeg_kit_flutter_new: ^4.6.7
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  cross_file: ^0.3.5+2
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
