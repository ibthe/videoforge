name: VideoForge — build all platforms

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videoforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Generate platform project and resolve packages
        shell: pwsh
        run: |
          python scripts/prepare_platforms.py
          flutter pub get

      - name: Build Windows app and portable ZIP
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          if (!(Test-Path "dist\VideoForge-Windows-Setup.exe")) {
            & $iscc "installer\VideoForge.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: VideoForge-Windows
          path: |
            dist/VideoForge-Windows-Portable.zip
            dist/VideoForge-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate platform project and resolve packages
        run: |
          python3 scripts/prepare_platforms.py
          flutter pub get

      - name: Build macOS DMG and PKG
        run: bash scripts/build_macos.sh

      - name: Upload macOS installers
        uses: actions/upload-artifact@v7
        with:
          name: VideoForge-macOS
          path: |
            dist/VideoForge-macOS.dmg
            dist/VideoForge-macOS.pkg
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at: $SDKMANAGER" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          NDK_VERSION="28.2.13676358"
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION"; then
              test -d "$SDK_ROOT/ndk/$NDK_VERSION"
              echo "Android NDK $NDK_VERSION installed."
              exit 0
            fi

            echo "NDK installation failed; removing incomplete download before retry."
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION" "$SDK_ROOT/.temp" "$HOME/.android/cache"
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done

          echo "Could not install Android NDK $NDK_VERSION after 3 attempts." >&2
          exit 1

      - name: Generate platform project and resolve packages
        run: |
          python3 scripts/prepare_platforms.py
          flutter pub get

      - name: Build Android APK and AAB
        run: bash scripts/build_android.sh

      - name: Upload Android builds
        uses: actions/upload-artifact@v7
        with:
          name: VideoForge-Android
          path: |
            dist/VideoForge-Android.apk
            dist/VideoForge-Android.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iPhone build (unsigned CI artifact)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate platform project and resolve packages
        run: |
          python3 scripts/prepare_platforms.py
          flutter pub get

      
      - name: Build iOS app without signing
        run: |
          # This edit is CI-only: make Xcode's unsigned build explicit even on
          # Xcode versions that still validate automatic signing settings.
          python3 - <<'PY'
          from pathlib import Path
          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = project.read_text(encoding="utf-8")
          marker = "buildSettings = {"
          text = text.replace(marker, marker + "\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";")
          project.write_text(text, encoding="utf-8")
          PY
          flutter build ios --release --no-codesign \
            --dart-define=CI_BUILD=true


      - name: Package unsigned iOS app for CI inspection
        run: |
          mkdir -p dist
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            dist/VideoForge-iPhone-unsigned.app.zip

      - name: Upload iPhone build
        uses: actions/upload-artifact@v7
        with:
          name: VideoForge-iPhone-unsigned
          path: dist/VideoForge-iPhone-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14
